name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (includes ArchUnit layering and GWT-compatibility rules)
        run: ./gradlew build
      - name: Compile web build with GWT
        run: ./gradlew :redshell-html:dist