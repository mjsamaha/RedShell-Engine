plugins {
  // Applies the foojay-resolver plugin to allow automatic download of JDKs.
  id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}

rootProject.name = 'redshell'

// redshell-engine  : the engine library (no game code, GWT-compatible)
// redshell-desktop : LWJGL3 launcher
// redshell-html    : GWT (browser) launcher
// games:sandbox    : first proof-of-concept game
// games:arena      : second game (top-down arena shooter), built only on the public engine API
// examples         : one small focused example per subsystem (desktop)
include 'redshell-engine', 'redshell-desktop', 'redshell-html', 'games:sandbox', 'games:arena', 'examples'